# ==========================================================
# CẤU HÌNH MÁY CHỦ NGỌC RỒNG NEWGEN
# ==========================================================
server.local=false
server.test=false
server.daoautoupdater=false
server.sv=1
server.name=Ngọc Rồng NewGen
server.ip=127.0.0.1
server.port=14445
# Khi mở LAN / Radmin VPN / VPS, đổi 127.0.0.1 thành IP máy chủ của bạn:
server.sv1=Ngọc Rồng NewGen:127.0.0.1:14445:0,0,0
server.waitlogin=1
server.maxperip=999
server.maxplayer=1000
server.expserver=10

# ==========================================================
# CẤU HÌNH CƠ SỞ DỮ LIỆU MARIADB / MYSQL (PORT 3306)
# ==========================================================
database.driver=com.mysql.cj.jdbc.Driver
database.host=127.0.0.1
database.port=3306
database.name=nro_newgen
database.user=root
database.pass=
database.min=5
database.max=50
database.lifetime=120000

# ==========================================================
# CẤU HÌNH MỞ RỘNG CHO ADMIN (GÕ "reload" TRONG GAME ĐỂ NẠP NÓNG)
# ==========================================================
# Nội dung bảng thông báo từ Admin khi người chơi vào game (dùng | để xuống dòng, gõ off để tắt)
custom.login_notice=off

# Tự động tạo tài khoản khi người chơi mới tải game đăng nhập lần đầu
custom.autoregister=true
custom.starter.vnd=100000

# Chỉ số & Quà Tân Thủ khi mới tạo nhân vật
custom.starter.gold=50000000
custom.starter.gem=50000
custom.starter.ruby=10000
custom.starter.power=1500000
custom.starter.task=0
custom.starter.goldbar=20
custom.starter.capsule_vip=true

# Tỉ lệ rơi đồ, Vàng, Ngọc khi đánh quái
custom.drop.rate_mult=1
custom.drop.gold_mult=3
custom.drop.gem_percent=4
custom.drop.gem_amount=2
# Tỉ lệ rơi đồ Sét Kích Hoạt trên thang 10.000 (tính theo tốc độ farm thực tế ~20 quái/phút):
# - Gốc 3 map đầu: 25 (0.25% ~ 20 phút/món)
# - Khu Up SKH (+15) + Cỏ 4 Lá (+15) + Ước NR 1 Sao (+20% May mắn chung): 0.66% (~7.5 phút/món)
# - Đủ 5 món Set Gohan (+150% May mắn chung) + Khu SKH + Cỏ + NR 1s: 1.485% (~3.3 phút/món)
custom.skh.base_rate=25
custom.skh.zone_bonus=15
custom.skh.clover_bonus=15

# Danh sách vật phẩm rơi thêm toàn map theo cú pháp: itemId:soLuong:tiLeTren1000 (tự động nhân thêm % May mắn chung)
# 457:1:25 => Thỏi vàng khóa 2.5% gốc (~2.0 phút/thỏi) | 16:1:12.5 => Ngọc rồng 3 sao 1.25% gốc (~60 viên/4h tay trắng, Thú 2005 nhân x2.5)
custom.drop.global_items=457:1:25,16:1:12.5
